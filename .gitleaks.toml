# Secret scanning config. Runs in CI on every push and PR, and locally via the pre-commit hook
# installed by scripts/install-hooks.sh.
#
# PRIV-4 says credentials live in the macOS Keychain. This file is what makes that checkable
# rather than merely stated.

title = "mokaji"

[extend]
useDefault = true

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[A-Za-z0-9_-]{28,}'''
tags = ["google", "oauth"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
tags = ["anthropic"]

[[rules]]
id = "google-oauth-client-json"
description = "A downloaded Google OAuth client file, committed by accident"
regex = '''"(client_secret|refresh_token|private_key_id)"\s*:\s*"[^"]+"'''
tags = ["google", "oauth"]

[allowlist]
description = "Documentation and fixtures may name secrets without containing them"
paths = [
  '''SECURITY\.md''',
  '''\.env\.example''',
  '''\.gitleaks\.toml''',
]
# Placeholder values used in docs and test fixtures.
regexes = [
  '''GOCSPX-xxxxxxxxxxxxxxxxxxxxxxxxxxxx''',
  '''sk-ant-xxxxxxxxxxxxxxxxxxxx''',
]
