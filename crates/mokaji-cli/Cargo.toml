[package]
name        = "mokaji-cli"
description = "A terminal readout of the vault. The fastest honest test of the data layer — no UI in the way."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true

[[bin]]
name = "mokaji"
path = "src/main.rs"

[dependencies]
mokaji-core             = { path = "../mokaji-core" }
mokaji-connector-vault  = { path = "../mokaji-connector-vault" }
chrono                  = { workspace = true }
serde_json              = { workspace = true }
tokio                   = { workspace = true, features = ["rt-multi-thread", "macros"] }
