name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # so CI can be re-run by hand without an empty commit

# Least-privilege default: read-only workspace-wide; each job re-declares the minimum it needs.
permissions:
  contents: read

# Cost control. This repo is public, so standard GitHub-hosted runners are free and unlimited —
# but only on ubuntu. macOS runners bill at roughly 10x Linux, so do not casually add one: use a
# macOS job only for what genuinely cannot run elsewhere (Keychain, Metal, Tauri bundling), and
# gate it behind a release or a manual dispatch rather than every push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # Hash-pinned (OpenSSF Scorecard "Pinned-Dependencies"). A tag is mutable; a SHA is not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No third-party toolchain or cache action here on purpose. ubuntu-latest ships a current
      # stable Rust with clippy and rustfmt, so installing one would add an unpinnable dependency
      # to buy nothing. Build times for this workspace are a couple of minutes; caching can be
      # revisited when that stops being true.
      - name: toolchain
        run: rustc --version && cargo --version && cargo clippy --version && cargo fmt --version
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # PRIV-5 / PRIV-1, enforced structurally rather than by convention: only mokaji-net may depend
  # on a networking crate. If this ever fails, another crate — possibly the audio crate — has been
  # given the ability to open a socket.
  network-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: assert no crate but mokaji-net can reach the network
        run: |
          set -euo pipefail
          NET_CRATES='reqwest|hyper|ureq|curl|tokio-tungstenite|socket2|tiny_http|axum|warp|rustls|tokio-rustls|webpki-roots|native-tls|openssl|quinn|trust-dns|hickory|async-imap|imap|lettre|smtp'
          fail=0
          for manifest in crates/*/Cargo.toml src-tauri/Cargo.toml; do
            # NB: this must keep passing once crates/mokaji-audio exists (M-2). If it ever fails
            # for the audio crate, PRIV-1 has been broken — do not "fix" it by adding an exception.
            [ -f "$manifest" ] || continue
            case "$manifest" in */mokaji-net/*) continue ;; esac
            if grep -Eq "^[[:space:]]*($NET_CRATES)[[:space:]]*=" "$manifest"; then
              echo "::error file=$manifest::networking dependency outside mokaji-net (PRIV-5)"
              fail=1
            fi
            # tokio is a workspace-wide dependency for its runtime and channels, so the crate name
            # alone proves nothing. The `net` feature is the part that opens sockets, and it must
            # exist in exactly one manifest.
            if grep -E "^[[:space:]]*tokio[[:space:]]*=" "$manifest" | grep -q '"net"'; then
              echo "::error file=$manifest::tokio's `net` feature outside mokaji-net (PRIV-5)"
              fail=1
            fi
          done
          exit $fail

  # PRIV-4: credentials live in the macOS Keychain, never in the tree. Mirrors the pre-commit
  # hook, which catches the same thing earlier.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # a secret committed and later deleted is still published
      - run: ./scripts/scan-secrets.sh

  # The repo is public and MOKaji reads one person's life. Nothing personal may land in a commit.
  personal-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-personal-data.sh
      # `.private-terms` is the vault-content denylist. It is the disclosure it exists to prevent,
      # so it must never be tracked — the pre-commit hook refuses it, and this is the backstop for
      # a commit made with --no-verify or on a clone where hooks were never installed.
      - name: the denylist must never be committed
        run: |
          if git ls-files --error-unmatch .private-terms >/dev/null 2>&1; then
            echo "::error file=.private-terms::the vault denylist is tracked — it must never be committed"
            exit 1
          fi
          echo "denylist not tracked — correct"
